name: Public smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Build public ZIP
        run: python scripts/package_release.py
      - name: Extract release
        run: python -m zipfile -e dist/elidli-personal-vpn-setup.zip runner-check
      - name: Test extracted package without installing dependencies
        run: python -X utf8 runner-check/elidli-personal-vpn-setup/tests/test_smoke.py
